<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paint Pot Mixer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-1: #fff7e8;
    --bg-2: #ffe5f1;
    --ink: #2b2140;
    --shadow: 0 10px 30px rgba(43, 33, 64, 0.18);
    --shadow-sm: 0 4px 14px rgba(43, 33, 64, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 0%, #ffd1e8 0%, transparent 40%),
      radial-gradient(circle at 90% 10%, #cfe9ff 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, #fff3b0 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    text-align: center;
    padding: 18px 16px 4px;
  }
  h1 {
    font-size: clamp(22px, 5vw, 44px);
    margin: 0;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 0 #fff;
  }
  h1 .pop {
    display: inline-block;
    transform-origin: 50% 80%;
    animation: bounce 1.6s infinite ease-in-out;
  }
  h1 .pop:nth-child(2) { animation-delay: 0.1s; }
  h1 .pop:nth-child(3) { animation-delay: 0.2s; }
  h1 .pop:nth-child(4) { animation-delay: 0.3s; }
  h1 .pop:nth-child(5) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
  }
  p.subtitle {
    margin: 6px 0 0;
    font-size: clamp(14px, 2.4vw, 18px);
    opacity: 0.75;
  }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 12px clamp(10px, 3vw, 28px) 24px;
  }

  .stage {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    gap: clamp(10px, 2.5vw, 24px);
    align-items: end;
    margin-top: 14px;
  }
  @media (max-width: 720px) {
    .stage {
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 6px;
    }
    .pots { order: 2; }
    .bowl-wrap { order: 1; }
    .panel { order: 3; }
    .pots {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 8px !important;
    }
    .pot { width: auto !important; }
  }

  .pots {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
  .pot {
    width: 100%;
    max-width: 180px;
    background: white;
    border-radius: 18px;
    padding: 10px 8px 12px;
    box-shadow: var(--shadow);
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    border: 3px solid transparent;
  }
  .pot:hover { transform: translateY(-3px); }
  .pot:active { transform: translateY(1px) scale(0.98); }
  .pot:focus-visible { outline: none; border-color: #ffb86b; }
  .pot svg { width: 64%; height: auto; display: block; margin: 0 auto; max-height: 80px; }
  .pot .label {
    font-size: 15px;
    font-weight: 700;
    margin-top: 4px;
  }
  .pot .count {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 1px;
  }

  .bowl-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .bowl {
    width: clamp(220px, 60vw, 380px);
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    background: #ffffff;
    box-shadow:
      inset 0 -10px 20px rgba(0,0,0,0.18),
      inset 0 8px 16px rgba(255,255,255,0.55),
      inset 0 0 0 3px rgba(255,255,255,0.35),
      var(--shadow);
    transition: background 0.4s ease;
    position: relative;
    overflow: hidden;
  }
  /* Water surface shine */
  .bowl::before {
    content: "";
    position: absolute;
    top: 8%;
    left: 6%;
    right: 6%;
    height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.55);
    filter: blur(1px);
    pointer-events: none;
  }
  /* Diagonal glass highlight */
  .bowl::after {
    content: "";
    position: absolute;
    top: 10%; left: 8%;
    width: 22%; height: 70%;
    border-radius: 40%;
    background: linear-gradient(160deg, rgba(255,255,255,0.45), rgba(255,255,255,0));
    filter: blur(4px);
    pointer-events: none;
  }
  .bowl-base {
    width: 92%;
    max-width: clamp(220px, 60vw, 380px);
    height: 10px;
    margin-top: -2px;
    background: linear-gradient(180deg, #6b6358, #3f3a32);
    border-radius: 4px;
    box-shadow: var(--shadow-sm);
  }
  .color-name {
    font-size: clamp(18px, 3.4vw, 28px);
    font-weight: 700;
    text-align: center;
    margin-top: 2px;
    min-height: 1.2em;
    transition: color 0.3s ease;
  }
  .hex {
    font-family: "Fredoka", monospace;
    font-size: 13px;
    opacity: 0.6;
    letter-spacing: 1px;
    text-align: center;
  }

  .panel {
    background: white;
    border-radius: 18px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
  }
  .target-swatch {
    width: 100%;
    aspect-ratio: 2 / 1;
    border-radius: 14px;
    background: #eee;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.15);
    transition: background 0.3s ease;
  }
  @media (max-width: 720px) {
    .target-swatch { aspect-ratio: 4 / 1; border-radius: 12px; }
    .panel { padding: 10px 12px; gap: 6px; }
  }
  .target-name {
    text-align: center;
    font-weight: 600;
    font-size: 15px;
    opacity: 0.85;
  }
  .match-meter {
    width: 100%;
    height: 10px;
    background: #f1ecf6;
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.12);
  }
  .match-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff7eb6, #ffd166, #6ddc8e);
    transition: width 0.3s ease;
    border-radius: 999px;
  }
  .match-text {
    text-align: center;
    font-size: 13px;
    opacity: 0.75;
  }

  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button.btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: var(--ink);
    background: white;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button.btn:hover { transform: translateY(-2px); }
  button.btn:active { transform: translateY(1px); }
  button.btn.primary {
    background: linear-gradient(135deg, #ffb86b, #ff7eb6);
    color: white;
  }
  button.btn.ghost {
    background: rgba(255,255,255,0.7);
  }

  /* Falling drop animation */
  .drop {
    position: fixed;
    width: 22px; height: 28px;
    pointer-events: none;
    z-index: 50;
  }
  .drop svg { width: 100%; height: 100%; }

  /* Confetti for win */
  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }
  .confetti span {
    position: absolute;
    width: 10px; height: 14px;
    top: -20px;
    border-radius: 2px;
    animation: fall 1.6s linear forwards;
  }
  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0;
    }
  }

  footer {
    text-align: center;
    padding: 14px 16px 20px;
    font-size: 12px;
    opacity: 0.55;
  }

  /* Uppercase color names */
  .pot .label,
  .color-name {
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  /* Language switcher */
  .lang-switch {
    position: fixed;
    top: 12px;
    right: 12px;
    display: inline-flex;
    background: white;
    border-radius: 999px;
    padding: 3px;
    box-shadow: var(--shadow-sm);
    z-index: 60;
    gap: 2px;
  }
  .lang-switch button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 6px 12px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: transparent;
    color: var(--ink);
    opacity: 0.55;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .lang-switch button.active {
    background: linear-gradient(135deg, #ffb86b, #ff7eb6);
    color: white;
    opacity: 1;
  }
  .lang-switch button:hover { opacity: 1; }

  @media (max-width: 720px) {
    header { padding: 14px 16px 0; }
    p.subtitle { display: none; }
    .hex { display: none; }
    .color-name { font-size: 17px; margin-top: 0; }
    .bowl-wrap { gap: 4px; }
    .panel h2 { font-size: 14px; }
    .target-name { font-size: 13px; }
    .match-text { font-size: 12px; }
    .controls { margin-top: 10px; }
    button.btn { font-size: 14px; padding: 9px 16px; }
    main { padding-bottom: 16px; }
    footer { display: none; }
    .lang-switch { top: 8px; right: 8px; }
    .lang-switch button { font-size: 12px; padding: 5px 10px; }
  }
</style>
</head>
<body>
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="en" class="active">EN</button>
    <button type="button" data-lang="cs">CZ</button>
  </div>

  <header>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <main>
    <div class="stage">
      <!-- Paint pots -->
      <div class="pots" role="group" aria-label="Paint pots">
        <button class="pot" data-color="red" aria-label="Add a drop of red paint">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <ellipse cx="50" cy="22" rx="34" ry="10" fill="#ee3a3a"/>
            <path d="M16 22 Q 16 78 50 86 Q 84 78 84 22 Z" fill="#d62828"/>
            <ellipse cx="50" cy="22" rx="34" ry="10" fill="none" stroke="#a51c1c" stroke-width="2"/>
            <ellipse cx="40" cy="20" rx="10" ry="3" fill="#ff8a8a" opacity="0.6"/>
          </svg>
          <div class="label" data-label="red">Red</div>
          <div class="count" data-count="red">0 drops</div>
        </button>
        <button class="pot" data-color="yellow" aria-label="Add a drop of yellow paint">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <ellipse cx="50" cy="22" rx="34" ry="10" fill="#ffd23f"/>
            <path d="M16 22 Q 16 78 50 86 Q 84 78 84 22 Z" fill="#f7b801"/>
            <ellipse cx="50" cy="22" rx="34" ry="10" fill="none" stroke="#a07800" stroke-width="2"/>
            <ellipse cx="40" cy="20" rx="10" ry="3" fill="#fff2a8" opacity="0.7"/>
          </svg>
          <div class="label" data-label="yellow">Yellow</div>
          <div class="count" data-count="yellow">0 drops</div>
        </button>
        <button class="pot" data-color="blue" aria-label="Add a drop of blue paint">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <ellipse cx="50" cy="22" rx="34" ry="10" fill="#3a86ff"/>
            <path d="M16 22 Q 16 78 50 86 Q 84 78 84 22 Z" fill="#1e63d6"/>
            <ellipse cx="50" cy="22" rx="34" ry="10" fill="none" stroke="#103a82" stroke-width="2"/>
            <ellipse cx="40" cy="20" rx="10" ry="3" fill="#a3c4ff" opacity="0.7"/>
          </svg>
          <div class="label" data-label="blue">Blue</div>
          <div class="count" data-count="blue">0 drops</div>
        </button>
      </div>

      <!-- Mixing bowl -->
      <div class="bowl-wrap">
        <div class="bowl" id="bowl" aria-live="polite"></div>
        <div class="bowl-base"></div>
        <div>
          <div class="color-name" id="colorName">Empty bowl</div>
          <div class="hex" id="colorHex">#FFFFFF</div>
        </div>
      </div>

      <!-- Challenge panel -->
      <div class="panel">
        <h2 id="matchTitle">🎯 Match this color</h2>
        <div class="target-swatch" id="targetSwatch"></div>
        <div class="target-name" id="targetName"></div>
        <div class="match-meter"><div class="match-fill" id="matchFill"></div></div>
        <div class="match-text" id="matchText"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary" id="resetBtn"></button>
      <button class="btn ghost" id="newTargetBtn"></button>
    </div>
  </main>

  <footer id="footer"></footer>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  // i18n strings
  const T = {
    en: {
      titlePop: "Paint",
      titleRest: " Pot Mixer",
      subtitle: "Tap a pot to add a drop. Mix the colors and try to match the target!",
      pots: { red: "Red", yellow: "Yellow", blue: "Blue" },
      potAria: { red: "Add a drop of red paint", yellow: "Add a drop of yellow paint", blue: "Add a drop of blue paint" },
      drops: (n) => n + (n === 1 ? " drop" : " drops"),
      emptyBowl: "Empty bowl",
      matchTitle: "🎯 Match this color",
      matchPct: (n) => n + "% match",
      perfect: "✨ Perfect match! ✨",
      reset: "🧽 Wash bowl",
      newTarget: "🎲 New target",
      footer: "Made for tiny artists. Mix red + yellow, yellow + blue, or red + blue and see the magic ✨",
      palette: {
        Red: "Red", Crimson: "Crimson", Pink: "Pink", Coral: "Coral",
        Orange: "Orange", Peach: "Peach", Yellow: "Yellow", Gold: "Gold",
        Olive: "Olive", Lime: "Lime", Green: "Green", Mint: "Mint",
        Teal: "Teal", Sky: "Sky", Blue: "Blue", Indigo: "Indigo",
        Purple: "Purple", Magenta: "Magenta", Brown: "Brown", Tan: "Tan",
        Beige: "Beige", Gray: "Gray", Black: "Black", White: "White"
      },
      targets: {
        Orange: "Orange", Green: "Green", Purple: "Purple",
        "Red-orange": "Red-orange", "Golden yellow": "Golden yellow",
        Lime: "Lime", Teal: "Teal", Magenta: "Magenta",
        Indigo: "Indigo", Brown: "Brown"
      }
    },
    cs: {
      titlePop: "Mixér",
      titleRest: " barev",
      subtitle: "Klepni na kelímek a přidej kapku. Smíchej barvy a trefa cíle!",
      pots: { red: "Červená", yellow: "Žlutá", blue: "Modrá" },
      potAria: { red: "Přidat kapku červené barvy", yellow: "Přidat kapku žluté barvy", blue: "Přidat kapku modré barvy" },
      drops: (n) => {
        if (n === 1) return "1 kapka";
        if (n >= 2 && n <= 4) return n + " kapky";
        return n + " kapek";
      },
      emptyBowl: "Prázdné akvárium",
      matchTitle: "🎯 Najdi tuto barvu",
      matchPct: (n) => n + " % shoda",
      perfect: "✨ Přesná trefa! ✨",
      reset: "🧽 Vypláchnout",
      newTarget: "🎲 Nový cíl",
      footer: "Pro malé umělce. Smíchej červenou + žlutou, žlutou + modrou nebo červenou + modrou a uvidíš kouzlo ✨",
      palette: {
        Red: "Červená", Crimson: "Karmínová", Pink: "Růžová", Coral: "Korálová",
        Orange: "Oranžová", Peach: "Broskvová", Yellow: "Žlutá", Gold: "Zlatá",
        Olive: "Olivová", Lime: "Limetková", Green: "Zelená", Mint: "Mátová",
        Teal: "Modrozelená", Sky: "Nebesky modrá", Blue: "Modrá", Indigo: "Indigo",
        Purple: "Fialová", Magenta: "Purpurová", Brown: "Hnědá", Tan: "Pískově hnědá",
        Beige: "Béžová", Gray: "Šedá", Black: "Černá", White: "Bílá"
      },
      targets: {
        Orange: "Oranžová", Green: "Zelená", Purple: "Fialová",
        "Red-orange": "Červenooranžová", "Golden yellow": "Sytě žlutá",
        Lime: "Limetková", Teal: "Modrozelená", Magenta: "Purpurová",
        Indigo: "Indigo", Brown: "Hnědá"
      }
    }
  };

  let lang = (function () {
    try { return localStorage.getItem("color-mixer-lang") || "en"; } catch (e) { return "en"; }
  })();
  if (!T[lang]) lang = "en";
  const tr = () => T[lang];

  // RYB cube corners as RGB (paint-like primaries)
  // (r, y, b) ∈ {0,1}^3
  const CUBE = {
    "000": [255, 255, 255],   // empty / white
    "100": [220,  40,  40],   // red
    "010": [255, 215,  60],   // yellow
    "001": [ 50, 100, 200],   // blue
    "110": [255, 140,  40],   // orange
    "011": [ 40, 170,  80],   // green
    "101": [130,  50, 160],   // purple
    "111": [ 80,  55,  40]    // brown / dark
  };

  function trilinearRYB(r, y, b) {
    // r, y, b in [0, 1]
    const lerp = (a, b, t) => a + (b - a) * t;
    const c00 = CUBE["000"].map((v, i) => lerp(v, CUBE["100"][i], r));
    const c10 = CUBE["010"].map((v, i) => lerp(v, CUBE["110"][i], r));
    const c01 = CUBE["001"].map((v, i) => lerp(v, CUBE["101"][i], r));
    const c11 = CUBE["011"].map((v, i) => lerp(v, CUBE["111"][i], r));
    const c0 = c00.map((v, i) => lerp(v, c10[i], y));
    const c1 = c01.map((v, i) => lerp(v, c11[i], y));
    return c0.map((v, i) => Math.round(lerp(v, c1[i], b)));
  }

  function mixDrops(rDrops, yDrops, bDrops) {
    const total = rDrops + yDrops + bDrops;
    if (total === 0) return [255, 255, 255];
    const max = Math.max(rDrops, yDrops, bDrops);
    return trilinearRYB(rDrops / max, yDrops / max, bDrops / max);
  }

  function rgbToHex([r, g, b]) {
    return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase();
  }

  // Named palette — the displayed name is the closest entry to the mixed RGB.
  const PALETTE = [
    ["Red",     [220,  40,  40]],
    ["Crimson", [150,  30,  50]],
    ["Pink",    [255, 130, 180]],
    ["Coral",   [255, 110, 100]],
    ["Orange",  [255, 140,  40]],
    ["Peach",   [255, 200, 160]],
    ["Yellow",  [255, 215,  60]],
    ["Gold",    [220, 170,  40]],
    ["Olive",   [130, 130,  40]],
    ["Lime",    [180, 230,  60]],
    ["Green",   [ 40, 170,  80]],
    ["Mint",    [150, 230, 180]],
    ["Teal",    [ 40, 160, 160]],
    ["Sky",     [120, 180, 240]],
    ["Blue",    [ 50, 100, 200]],
    ["Indigo",  [ 60,  60, 140]],
    ["Purple",  [130,  50, 160]],
    ["Magenta", [210,  60, 170]],
    ["Brown",   [110,  70,  40]],
    ["Tan",     [200, 170, 130]],
    ["Beige",   [240, 230, 200]],
    ["Gray",    [160, 160, 160]],
    ["Black",   [ 30,  25,  20]],
    ["White",   [250, 250, 250]]
  ];

  function paletteKeyForRGB(rgb) {
    let best = null, bestD = Infinity;
    for (const [name, c] of PALETTE) {
      const dr = rgb[0] - c[0], dg = rgb[1] - c[1], db = rgb[2] - c[2];
      const d = dr * dr + dg * dg + db * db;
      if (d < bestD) { bestD = d; best = name; }
    }
    return best;
  }

  function nameForRGB(rgb, isEmpty) {
    if (isEmpty) return tr().emptyBowl;
    return tr().palette[paletteKeyForRGB(rgb)];
  }

  // Targets the kid can try to reach. Each is a key + the drop recipe to make it.
  // The display name comes from translations[lang].targets[key].
  const TARGETS = [
    { key: "Orange",        recipe: { red: 1, yellow: 1, blue: 0 } },
    { key: "Green",         recipe: { red: 0, yellow: 1, blue: 1 } },
    { key: "Purple",        recipe: { red: 1, yellow: 0, blue: 1 } },
    { key: "Red-orange",    recipe: { red: 2, yellow: 1, blue: 0 } },
    { key: "Golden yellow", recipe: { red: 1, yellow: 2, blue: 0 } },
    { key: "Lime",          recipe: { red: 0, yellow: 2, blue: 1 } },
    { key: "Teal",          recipe: { red: 0, yellow: 1, blue: 2 } },
    { key: "Magenta",       recipe: { red: 2, yellow: 0, blue: 1 } },
    { key: "Indigo",        recipe: { red: 1, yellow: 0, blue: 2 } },
    { key: "Brown",         recipe: { red: 1, yellow: 1, blue: 1 } }
  ];

  function targetRGB(t) {
    return mixDrops(t.recipe.red, t.recipe.yellow, t.recipe.blue);
  }

  // State
  const state = { red: 0, yellow: 0, blue: 0, target: null, won: false };

  // DOM
  const bowl = document.getElementById("bowl");
  const colorName = document.getElementById("colorName");
  const colorHex = document.getElementById("colorHex");
  const targetSwatch = document.getElementById("targetSwatch");
  const targetName = document.getElementById("targetName");
  const matchFill = document.getElementById("matchFill");
  const matchText = document.getElementById("matchText");
  const confettiBox = document.getElementById("confetti");

  function pickRandomTarget(avoid) {
    let t;
    do {
      t = TARGETS[Math.floor(Math.random() * TARGETS.length)];
    } while (avoid && t.key === avoid.key);
    return t;
  }

  function setTarget(t) {
    state.target = t;
    state.won = false;
    const rgb = targetRGB(t);
    targetSwatch.style.background = `rgb(${rgb.join(",")})`;
    targetName.textContent = tr().targets[t.key];
    updateMatch();
  }

  function colorDistance(a, b) {
    const dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
    return Math.sqrt(dr * dr + dg * dg + db * db);
  }

  function updateMatch() {
    const cur = mixDrops(state.red, state.yellow, state.blue);
    if (!state.target) return;
    const tgt = targetRGB(state.target);
    const dist = colorDistance(cur, tgt);
    const maxDist = Math.sqrt(3) * 255;
    const pct = Math.max(0, Math.round((1 - dist / maxDist) * 100));
    // Boost feel-good factor: square it a bit so small differences read closer.
    const display = Math.min(100, Math.round(Math.pow(pct / 100, 0.6) * 100));
    matchFill.style.width = display + "%";
    matchText.textContent = tr().matchPct(display);
    const empty = state.red + state.yellow + state.blue === 0;
    if (!empty && dist < 18 && !state.won) {
      state.won = true;
      celebrate();
      matchText.textContent = tr().perfect;
    }
  }

  function updateBowl() {
    const rgb = mixDrops(state.red, state.yellow, state.blue);
    bowl.style.background = `rgb(${rgb.join(",")})`;
    colorName.textContent = nameForRGB(rgb, state.red + state.yellow + state.blue === 0);
    colorHex.textContent = rgbToHex(rgb);
    document.querySelectorAll("[data-count]").forEach(el => {
      const c = el.dataset.count;
      el.textContent = tr().drops(state[c]);
    });
    updateMatch();
  }

  function dropColor(color) {
    if (color === "red") return "#d62828";
    if (color === "yellow") return "#f7b801";
    if (color === "blue") return "#1e63d6";
    return "#888";
  }

  function animateDrop(fromEl, color) {
    const fromRect = fromEl.getBoundingClientRect();
    const bowlRect = bowl.getBoundingClientRect();
    const startX = fromRect.left + fromRect.width / 2 - 11;
    const startY = fromRect.top + fromRect.height * 0.55;
    const endX = bowlRect.left + bowlRect.width / 2 - 11;
    const endY = bowlRect.top + bowlRect.height / 2 - 14;

    const drop = document.createElement("div");
    drop.className = "drop";
    drop.innerHTML = `<svg viewBox="0 0 22 28" aria-hidden="true">
      <path d="M11 1 C 4 12, 1 18, 1 22 a10 10 0 0 0 20 0 C 21 18, 18 12, 11 1 Z"
            fill="${dropColor(color)}" stroke="rgba(0,0,0,0.18)" stroke-width="0.8"/>
      <ellipse cx="8" cy="18" rx="3" ry="5" fill="rgba(255,255,255,0.45)"/>
    </svg>`;
    drop.style.left = startX + "px";
    drop.style.top = startY + "px";
    document.body.appendChild(drop);

    const dx = endX - startX, dy = endY - startY;
    drop.animate(
      [
        { transform: "translate(0, 0) scale(1)", opacity: 1 },
        { transform: `translate(${dx * 0.5}px, ${dy * 0.5}px) scale(1.05)`, opacity: 1, offset: 0.55 },
        { transform: `translate(${dx}px, ${dy}px) scale(0.6)`, opacity: 0 }
      ],
      { duration: 520, easing: "cubic-bezier(.4,.0,.6,1)" }
    ).onfinish = () => drop.remove();
  }

  function celebrate() {
    const colors = ["#ff7eb6", "#ffd166", "#6ddc8e", "#3a86ff", "#b388ff", "#ff8a5b"];
    for (let i = 0; i < 60; i++) {
      const s = document.createElement("span");
      s.style.left = Math.random() * 100 + "vw";
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = (Math.random() * 0.4) + "s";
      s.style.animationDuration = (1.2 + Math.random() * 0.9) + "s";
      s.style.transform = `rotate(${Math.random() * 360}deg)`;
      confettiBox.appendChild(s);
      setTimeout(() => s.remove(), 2400);
    }
  }

  function reset() {
    state.red = 0; state.yellow = 0; state.blue = 0; state.won = false;
    updateBowl();
  }

  // Wire up pots
  document.querySelectorAll(".pot").forEach(pot => {
    const color = pot.dataset.color;
    pot.addEventListener("click", () => {
      state[color]++;
      animateDrop(pot, color);
      // Update bowl after drop arrives
      setTimeout(updateBowl, 460);
    });
  });

  document.getElementById("resetBtn").addEventListener("click", reset);
  document.getElementById("newTargetBtn").addEventListener("click", () => {
    setTarget(pickRandomTarget(state.target));
    reset();
  });

  function applyLanguage(next) {
    if (!T[next]) return;
    lang = next;
    try { localStorage.setItem("color-mixer-lang", lang); } catch (e) {}
    document.documentElement.lang = lang === "cs" ? "cs" : "en";

    const t = tr();
    // Title with bouncing letters
    const titleEl = document.getElementById("title");
    titleEl.innerHTML = [...t.titlePop]
      .map(c => `<span class="pop">${c}</span>`)
      .join("") + t.titleRest;

    document.getElementById("subtitle").textContent = t.subtitle;
    document.querySelectorAll("[data-label]").forEach(el => {
      el.textContent = t.pots[el.dataset.label];
    });
    document.querySelectorAll(".pot[data-color]").forEach(el => {
      el.setAttribute("aria-label", t.potAria[el.dataset.color]);
    });
    document.getElementById("matchTitle").textContent = t.matchTitle;
    document.getElementById("resetBtn").textContent = t.reset;
    document.getElementById("newTargetBtn").textContent = t.newTarget;
    document.getElementById("footer").textContent = t.footer;

    // Re-render dynamic strings
    if (state.target) {
      document.getElementById("targetName").textContent = t.targets[state.target.key];
    }
    updateBowl();

    document.querySelectorAll(".lang-switch button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
  }

  document.querySelectorAll(".lang-switch button").forEach(b => {
    b.addEventListener("click", () => applyLanguage(b.dataset.lang));
  });

  // Init
  setTarget(pickRandomTarget());
  applyLanguage(lang);
})();
</script>
</body>
</html>
