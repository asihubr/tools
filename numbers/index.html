<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-1: #fff7e8;
    --bg-2: #ffe5f1;
    --ink: #2b2140;
    --shadow: 0 10px 30px rgba(43, 33, 64, 0.18);
    --shadow-sm: 0 4px 14px rgba(43, 33, 64, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 0%, #ffd1e8 0%, transparent 40%),
      radial-gradient(circle at 90% 10%, #cfe9ff 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, #fff3b0 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 64px;
  }
  .home-link {
    position: fixed;
    top: 12px;
    left: 12px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: white;
    box-shadow: var(--shadow-sm);
    font-size: 22px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    z-index: 60;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .home-link:hover { transform: scale(1.06); }
  .home-link:active { transform: scale(0.95); }
  .home-link:focus-visible { outline: 3px solid #ffb86b; outline-offset: 2px; }
  h1 {
    font-size: clamp(18px, 3vw, 26px);
    margin: 0;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 0 #fff;
    font-weight: 700;
    line-height: 1;
    text-align: center;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .seg {
    display: inline-flex;
    background: white;
    border-radius: 999px;
    padding: 3px;
    box-shadow: var(--shadow-sm);
  }
  .seg button {
    border: 0;
    background: transparent;
    padding: 6px 14px;
    border-radius: 999px;
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    min-width: 48px;
  }
  .seg button.active {
    background: linear-gradient(135deg, #ffd1e8, #cfe9ff);
    box-shadow: var(--shadow-sm);
  }

  .lang-wrap {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 60;
  }
  .lang-trigger {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 0;
    border-radius: 999px;
    padding: 6px 12px 6px 10px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    font-size: 13px;
    line-height: 1;
  }
  .lang-trigger .flag {
    font-size: 18px;
    line-height: 1;
  }
  .lang-trigger .caret {
    font-size: 10px;
    opacity: 0.6;
    margin-left: 2px;
  }
  .lang-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: white;
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 6px;
    margin: 0;
    list-style: none;
    min-width: 180px;
    z-index: 50;
    max-height: 70vh;
    overflow-y: auto;
    display: none;
  }
  .lang-menu.open { display: block; }
  .lang-menu li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.1;
  }
  .lang-menu li:hover, .lang-menu li.active {
    background: linear-gradient(135deg, #ffd1e8, #cfe9ff);
  }
  .lang-menu li .flag { font-size: 18px; }

  main {
    flex: 1;
    padding: 4px clamp(8px, 2vw, 16px) clamp(8px, 2vw, 16px);
    min-height: 0;
    display: flex;
  }
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(var(--cols, 6), 1fr);
    grid-auto-rows: 1fr;
    gap: clamp(4px, 1vw, 10px);
  }
  .number {
    background: white;
    border: none;
    border-radius: clamp(10px, 1.5vw, 18px);
    box-shadow: var(--shadow-sm);
    font-family: inherit;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--cell-font, 28px);
    transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .number:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .number:active, .number.playing {
    transform: scale(0.94);
    background: linear-gradient(135deg, #ffd1e8, #cfe9ff);
  }
  .number:focus-visible {
    outline: 3px solid #ffb86b;
    outline-offset: 2px;
  }
  @media (max-width: 560px) {
    header { padding: 10px 54px; }
    .home-link { top: 8px; left: 8px; width: 38px; height: 38px; font-size: 19px; }
    .lang-wrap { top: 8px; right: 8px; }
  }
</style>
</head>
<body>
  <a class="home-link" href="../" aria-label="Home" title="Home">🏠</a>
  <header>
    <h1 id="title">🔢 Numbers</h1>
    <div class="controls">
      <div class="seg" id="range" role="group" aria-label="Range">
        <button data-range="10" aria-pressed="false">1–10</button>
        <button data-range="20" aria-pressed="true">1–20</button>
        <button data-range="100" aria-pressed="false">1–100</button>
      </div>
    </div>
    <div class="lang-wrap">
      <button class="lang-trigger" id="langTrigger" aria-haspopup="listbox" aria-expanded="false">
        <span class="flag" id="langFlag">🇬🇧</span>
        <span class="lang-name" id="langName">English</span>
        <span class="caret">▼</span>
      </button>
      <ul class="lang-menu" id="langMenu" role="listbox"></ul>
    </div>
  </header>
  <main>
    <div class="grid" id="grid" aria-label="Numbers"></div>
  </main>
<script>
  const LANGUAGES = [
    { code: "en", name: "English",     flag: "🇬🇧", tts: "en-US" },
    { code: "cs", name: "Čeština",     flag: "🇨🇿", tts: "cs-CZ" },
    { code: "es", name: "Español",     flag: "🇪🇸", tts: "es-ES" },
    { code: "fr", name: "Français",    flag: "🇫🇷", tts: "fr-FR" },
    { code: "de", name: "Deutsch",     flag: "🇩🇪", tts: "de-DE" },
    { code: "it", name: "Italiano",    flag: "🇮🇹", tts: "it-IT" },
    { code: "pt", name: "Português",   flag: "🇵🇹", tts: "pt-PT" },
    { code: "ru", name: "Русский",     flag: "🇷🇺", tts: "ru-RU" },
    { code: "pl", name: "Polski",      flag: "🇵🇱", tts: "pl-PL" },
    { code: "nl", name: "Nederlands",  flag: "🇳🇱", tts: "nl-NL" },
  ];

  const TITLES = {
    en: "🔢 Numbers", cs: "🔢 Čísla", es: "🔢 Números", fr: "🔢 Nombres",
    de: "🔢 Zahlen",  it: "🔢 Numeri", pt: "🔢 Números", ru: "🔢 Числа",
    pl: "🔢 Liczby",  nl: "🔢 Getallen",
  };

  const grid = document.getElementById("grid");
  const titleEl = document.getElementById("title");
  const rangeButtons = document.querySelectorAll("#range button");
  const langTrigger = document.getElementById("langTrigger");
  const langMenu = document.getElementById("langMenu");
  const langFlagEl = document.getElementById("langFlag");
  const langNameEl = document.getElementById("langName");

  const VALID_RANGES = [10, 20, 100];

  let lang = "en";
  let range = 20;
  try {
    lang = localStorage.getItem("numbers.lang") || lang;
    const savedRange = parseInt(localStorage.getItem("numbers.range") || "", 10);
    if (VALID_RANGES.includes(savedRange)) range = savedRange;
  } catch (_) {}
  if (!LANGUAGES.find(l => l.code === lang)) lang = "en";

  function langInfo() {
    return LANGUAGES.find(l => l.code === lang) || LANGUAGES[0];
  }

  function bestCols(count, w, h) {
    let best = 1, bestScore = Infinity;
    for (let c = 1; c <= count; c++) {
      const r = Math.ceil(count / c);
      const cw = w / c;
      const ch = h / r;
      const aspect = Math.max(cw, ch) / Math.min(cw, ch);
      if (aspect < bestScore) { bestScore = aspect; best = c; }
    }
    return best;
  }

  function speak(n) {
    if (!("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(n));
      u.lang = langInfo().tts;
      u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch (_) {}
  }

  function layout() {
    const w = grid.clientWidth;
    const h = grid.clientHeight;
    const count = grid.children.length;
    if (!w || !h || !count) return;
    const cols = bestCols(count, w, h);
    const rows = Math.ceil(count / cols);
    const gap = parseFloat(getComputedStyle(grid).gap) || 6;
    const cellW = (w - gap * (cols - 1)) / cols;
    const cellH = (h - gap * (rows - 1)) / rows;
    const cell = Math.min(cellW, cellH);
    grid.style.setProperty("--cols", cols);
    // Numbers can have up to 3 digits (100), so use a smaller fraction than letters.
    const factor = range === 100 ? 0.42 : 0.5;
    grid.style.setProperty("--cell-font", Math.max(14, Math.floor(cell * factor)) + "px");
  }

  function render() {
    grid.innerHTML = "";
    for (let n = 1; n <= range; n++) {
      const btn = document.createElement("button");
      btn.className = "number";
      btn.textContent = String(n);
      btn.setAttribute("aria-label", String(n));
      btn.addEventListener("click", () => {
        speak(n);
        btn.classList.add("playing");
        setTimeout(() => btn.classList.remove("playing"), 220);
      });
      grid.appendChild(btn);
    }
    layout();
  }

  function buildLangMenu() {
    langMenu.innerHTML = "";
    for (const l of LANGUAGES) {
      const li = document.createElement("li");
      li.setAttribute("role", "option");
      li.dataset.code = l.code;
      li.innerHTML = `<span class="flag">${l.flag}</span><span>${l.name}</span>`;
      li.addEventListener("click", () => {
        setLang(l.code);
        closeLangMenu();
      });
      langMenu.appendChild(li);
    }
  }

  function refreshLangMenuActive() {
    langMenu.querySelectorAll("li").forEach(li => {
      li.classList.toggle("active", li.dataset.code === lang);
    });
  }

  function openLangMenu() {
    langMenu.classList.add("open");
    langTrigger.setAttribute("aria-expanded", "true");
  }
  function closeLangMenu() {
    langMenu.classList.remove("open");
    langTrigger.setAttribute("aria-expanded", "false");
  }

  function setLang(newLang) {
    lang = newLang;
    const info = langInfo();
    langFlagEl.textContent = info.flag;
    langNameEl.textContent = info.name;
    titleEl.textContent = TITLES[lang] || TITLES.en;
    document.documentElement.lang = lang;
    refreshLangMenuActive();
    try { localStorage.setItem("numbers.lang", lang); } catch (_) {}
  }

  function setRange(newRange) {
    range = newRange;
    rangeButtons.forEach(b => {
      const on = parseInt(b.dataset.range, 10) === range;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    try { localStorage.setItem("numbers.range", String(range)); } catch (_) {}
    render();
  }

  rangeButtons.forEach(b => b.addEventListener("click", () => {
    const r = parseInt(b.dataset.range, 10);
    if (VALID_RANGES.includes(r)) setRange(r);
  }));
  langTrigger.addEventListener("click", (e) => {
    e.stopPropagation();
    if (langMenu.classList.contains("open")) closeLangMenu();
    else openLangMenu();
  });
  document.addEventListener("click", (e) => {
    if (!langMenu.contains(e.target) && e.target !== langTrigger) closeLangMenu();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeLangMenu();
  });
  window.addEventListener("resize", layout);
  if ("ResizeObserver" in window) new ResizeObserver(layout).observe(grid);

  buildLangMenu();
  setLang(lang);
  setRange(range);
</script>
</body>
</html>
