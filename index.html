<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-1: #fff7e8;
    --bg-2: #ffe5f1;
    --ink: #2b2140;
    --shadow: 0 10px 30px rgba(43, 33, 64, 0.18);
    --shadow-sm: 0 4px 14px rgba(43, 33, 64, 0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 0%, #ffd1e8 0%, transparent 40%),
      radial-gradient(circle at 90% 10%, #cfe9ff 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, #fff3b0 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 48px 16px 8px;
  }
  h1 {
    font-size: clamp(32px, 6vw, 52px);
    margin: 0;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 0 #fff;
  }
  p.subtitle {
    margin: 8px 0 0;
    font-size: clamp(14px, 2.4vw, 18px);
    opacity: 0.7;
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px clamp(12px, 3vw, 28px) 60px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
    margin-top: 24px;
  }
  a.card {
    background: white;
    border-radius: 22px;
    padding: 22px 20px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: 3px solid transparent;
  }
  a.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 36px rgba(43, 33, 64, 0.22);
  }
  a.card:focus-visible { outline: none; border-color: #ffb86b; }
  .card .emoji {
    font-size: 36px;
    line-height: 1;
  }
  .card h2 {
    margin: 4px 0 0;
    font-size: 22px;
    font-weight: 700;
  }
  .card p {
    margin: 0;
    font-size: 14px;
    opacity: 0.72;
    line-height: 1.4;
  }
  footer {
    text-align: center;
    padding: 20px;
    font-size: 13px;
    opacity: 0.55;
  }
</style>
</head>
<body>
  <header>
    <h1>🧰 Tools</h1>
    <p class="subtitle">A growing collection of tiny web apps.</p>
  </header>

  <main>
    <div class="grid">
      <a class="card" href="./color-mixer/">
        <div class="emoji">🎨</div>
        <h2>Paint Pot Mixer</h2>
        <p>A color mixing game for kids — combine red, yellow and blue drops to match a target color.</p>
      </a>
      <a class="card" href="./alphabet-teacher/">
        <div class="emoji">🔤</div>
        <h2>Alphabet Teacher</h2>
        <p>Tap each letter to hear its sound. English or Czech, with optional diacritics.</p>
      </a>
    </div>
  </main>

  <footer>More tools coming soon.</footer>
</body>
</html>
